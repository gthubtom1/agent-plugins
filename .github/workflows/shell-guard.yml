name: shell-guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shell-guard:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Shell guard offline policy tests
        shell: bash
        run: |
          node --version
          node --check plugins/pi/shell-guard/src/policy.mjs
          node --check plugins/pi/shell-guard/src/split.mjs
          node --check plugins/pi/shell-guard/src/rules/rm.mjs
          node --test plugins/pi/shell-guard/test/*.test.mjs
